<!doctype html>
<!--
  Contributor loader for the doomit engine build.

  This page is the lobby: it picks the IWAD and the ordered PWAD set, chooses
  single player / host / join and the room URL, and turns all of that into an
  argv. Nothing here needs a hand-edited command line, and nothing here is
  part of the engine: the engine runs in doom-frame.html, which this page
  creates and destroys.

  Mod changes restart the instance. Doom loads its WAD set once during
  D_DoomMain and has no supported path to unload one from a live session, so
  applying a changed set tears down the frame and launches a fresh module.
  That is a real restart, not a hot swap.

  The hash column is the multiplayer agreement input. Peers must agree on the
  ordered set AND on how each file loads: -merge differs from -file, and an
  embedded DEHACKED lump only takes effect when opted in, so two peers
  holding identical bytes can still desync if those policies differ.
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>doomit engine loader</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14100f;
        --panel: #1e1917;
        --line: #3a302c;
        --ink: #e8e0d8;
        --muted: #9a8d84;
        --accent: #c0392b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        display: grid;
        grid-template-columns: minmax(340px, 420px) 1fr;
        height: 100vh;
      }
      #lobby {
        border-right: 1px solid var(--line);
        overflow-y: auto;
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        letter-spacing: .14em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 14px;
      }
      fieldset {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 4px;
        margin: 0 0 14px;
        padding: 10px 12px 12px;
      }
      legend {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: .12em;
        text-transform: uppercase;
        padding: 0 4px;
      }
      label { display: block; margin: 6px 0; }
      input[type=text], input[type=number] {
        width: 100%;
        background: #120e0d;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 5px 7px;
        font: inherit;
      }
      button {
        background: #2b2320;
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 4px 8px;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: .4; cursor: default; }
      #launch {
        width: 100%;
        padding: 9px;
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        letter-spacing: .1em;
        text-transform: uppercase;
      }
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left;
        font-size: 10px;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: normal;
        padding: 2px 4px;
      }
      td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
      td.name { word-break: break-all; }
      .hash { color: var(--muted); font-size: 10px; word-break: break-all; }
      .empty { color: var(--muted); padding: 6px 4px; }
      select {
        background: #120e0d;
        color: var(--ink);
        border: 1px solid var(--line);
        font: inherit;
      }
      #argv {
        background: #120e0d;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 7px;
        color: var(--muted);
        word-break: break-all;
        min-height: 2.6em;
      }
      #stage { position: relative; background: #000; }
      #stage iframe { width: 100%; height: 100%; border: 0; display: block; }
      #placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        text-align: center;
        padding: 20px;
      }
      #log {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        max-height: 34%;
        overflow-y: auto;
        margin: 0;
        padding: 8px 10px;
        background: rgba(0,0,0,.78);
        border-top: 1px solid var(--line);
        color: #b9ada4;
        font-size: 11px;
        white-space: pre-wrap;
      }
      .warn { color: #e0a030; }
    </style>
  </head>
  <body>
    <div id="lobby">
      <h1>doomit engine</h1>

      <fieldset>
        <legend>IWAD</legend>
        <input type="file" id="iwad" accept=".wad">
        <div id="iwad-info" class="empty">None chosen. The pinned baseline is the shareware doom1.wad.</div>
      </fieldset>

      <fieldset>
        <legend>PWADs (ordered)</legend>
        <input type="file" id="pwads" accept=".wad,.deh,.bex" multiple>
        <table id="pwad-table">
          <thead>
            <tr><th>#</th><th>file</th><th>load</th><th>deh</th><th></th></tr>
          </thead>
          <tbody id="pwad-rows"></tbody>
        </table>
        <div id="pwad-empty" class="empty">None. Load order is the agreement order.</div>
      </fieldset>

      <fieldset>
        <legend>Session</legend>
        <label><input type="radio" name="mode" value="single" checked> Single player</label>
        <label><input type="radio" name="mode" value="host"> Host a room</label>
        <label><input type="radio" name="mode" value="join"> Join a room</label>
        <label>Room WebSocket URL
          <input type="text" id="room" placeholder="ws://127.0.0.1:9000/room" disabled>
        </label>
        <label>Start when this many nodes have joined
          <input type="number" id="nodes" value="2" min="2" max="8" disabled>
        </label>
        <label><input type="checkbox" id="deathmatch"> Deathmatch (otherwise co-op)</label>
      </fieldset>

      <fieldset>
        <legend>argv</legend>
        <div id="argv">-</div>
      </fieldset>

      <fieldset>
        <legend>Mod fingerprint (peers must match)</legend>
        <div id="fingerprint" class="hash">(no mods)</div>
      </fieldset>

      <button id="launch" disabled>Launch</button>
    </div>

    <div id="stage">
      <div id="placeholder">Choose an IWAD, then launch.</div>
      <pre id="log"></pre>
    </div>

    <script type="module">
      import { canonicalOrder, isCanonical, modArgv, fingerprint }
        from "./mod_order.js";

      const el = (id) => document.getElementById(id);
      const state = { iwad: null, pwads: [] };

      function log(text, cls) {
        const line = document.createElement("span");
        if (cls) line.className = cls;
        line.textContent = text + "\n";
        el("log").appendChild(line);
        el("log").scrollTop = el("log").scrollHeight;
      }

      // crypto.subtle only exists in a secure context. file:// is not one,
      // and a silent absence would surface much later as a blank hash
      // column, which is exactly the field peers are meant to compare.
      const canHash = !!(crypto && crypto.subtle);
      if (!canHash) {
        log("crypto.subtle unavailable: serve over http://localhost, not file://", "warn");
      }

      async function sha256(buffer) {
        const digest = await crypto.subtle.digest("SHA-256", buffer);
        return Array.from(new Uint8Array(digest))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      async function readFile(file) {
        const bytes = await file.arrayBuffer();
        return {
          name: file.name,
          bytes,
          hash: canHash ? await sha256(bytes) : "unavailable",
        };
      }

      el("iwad").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        state.iwad = await readFile(file);
        el("iwad-info").className = "";
        el("iwad-info").textContent = "";
        const n = document.createElement("div");
        n.textContent = state.iwad.name;
        const h = document.createElement("div");
        h.className = "hash";
        h.textContent = "sha256 " + state.iwad.hash;
        el("iwad-info").append(n, h);
        refresh();
      });

      el("pwads").addEventListener("change", async (e) => {
        for (const file of e.target.files) {
          const entry = await readFile(file);
          // load kind and dehacked are policy, not properties of the bytes,
          // so they are part of what peers have to agree on.
          entry.load = "file";
          entry.deh = false;
          state.pwads.push(entry);
        }
        e.target.value = "";
        refresh();
      });

      function move(i, delta) {
        const j = i + delta;
        if (j < 0 || j >= state.pwads.length) return;
        const [item] = state.pwads.splice(i, 1);
        state.pwads.splice(j, 0, item);
        refresh();
      }

      function renderPwads() {
        const rows = el("pwad-rows");
        rows.textContent = "";
        el("pwad-empty").style.display = state.pwads.length ? "none" : "";

        state.pwads.forEach((entry, i) => {
          const tr = document.createElement("tr");

          const idx = document.createElement("td");
          idx.textContent = String(i + 1);
          tr.appendChild(idx);

          const name = document.createElement("td");
          name.className = "name";
          const nm = document.createElement("div");
          nm.textContent = entry.name;
          const hs = document.createElement("div");
          hs.className = "hash";
          hs.textContent = entry.hash;
          name.append(nm, hs);
          tr.appendChild(name);

          const load = document.createElement("td");
          const sel = document.createElement("select");
          for (const kind of ["file", "merge"]) {
            const opt = document.createElement("option");
            opt.value = kind;
            opt.textContent = kind;
            if (entry.load === kind) opt.selected = true;
            sel.appendChild(opt);
          }
          sel.title = "-file loads normally; -merge merges sprite, flat and patch namespaces";
          sel.addEventListener("change", () => { entry.load = sel.value; refresh(); });
          load.appendChild(sel);
          tr.appendChild(load);

          const deh = document.createElement("td");
          const box = document.createElement("input");
          box.type = "checkbox";
          box.checked = entry.deh;
          box.title = "Load the DEHACKED lump embedded in this PWAD";
          box.addEventListener("change", () => { entry.deh = box.checked; refresh(); });
          deh.appendChild(box);
          tr.appendChild(deh);

          const actions = document.createElement("td");
          const buttons = [
            ["↑", () => move(i, -1)],
            ["↓", () => move(i, 1)],
            ["✕", () => { state.pwads.splice(i, 1); refresh(); }],
          ];
          for (const [label, fn] of buttons) {
            const b = document.createElement("button");
            b.textContent = label;
            b.addEventListener("click", fn);
            actions.appendChild(b);
          }
          tr.appendChild(actions);

          rows.appendChild(tr);
        });
      }

      function mode() {
        return document.querySelector("input[name=mode]:checked").value;
      }

      function buildArgv() {
        const argv = modArgv(state.pwads);

        if (el("deathmatch").checked) argv.push("-deathmatch");

        const m = mode();
        if (m === "host") {
          // -privateserver implies -server and skips registering the room
          // with the public chocolate master server, which is not reachable
          // through a room router anyway.
          argv.push("-privateserver", "-wss", el("room").value.trim(),
                    "-nodes", el("nodes").value);
        } else if (m === "join") {
          // The room host is always node 1; the router keys on node ids.
          argv.push("-connect", "1", "-wss", el("room").value.trim());
        }

        return argv;
      }

      function refresh() {
        // The engine loads every -merge before every -file, so an order it
        // cannot honour is normalized here rather than displayed as if it
        // were achievable.
        if (!isCanonical(state.pwads)) {
          state.pwads = canonicalOrder(state.pwads);
          log("reordered: merges load before files, so the list was " +
              "normalized to the order the engine will actually use", "warn");
        }

        renderPwads();
        el("fingerprint").textContent =
          state.pwads.length ? fingerprint(state.pwads) : "(no mods)";

        const networked = mode() !== "single";
        el("room").disabled = !networked;
        el("nodes").disabled = mode() !== "host";

        const argv = buildArgv();
        el("argv").textContent = argv.length ? argv.join(" ") : "(no arguments)";

        el("launch").disabled =
          !state.iwad || (networked && !el("room").value.trim());
        el("launch").textContent = frame ? "Relaunch" : "Launch";
      }

      let frame = null;

      function launch() {
        const argv = buildArgv();

        // Relaunch is a teardown. Removing the iframe takes the instance,
        // its main loop, its audio graph and its FS with it, which is the
        // only reliable way to apply a changed WAD set.
        if (frame) {
          frame.remove();
          frame = null;
          log("--- engine restarted ---");
        }

        el("placeholder").style.display = "none";

        const files = [{ path: "/doom1.wad", bytes: state.iwad.bytes }];
        for (const p of state.pwads) {
          files.push({ path: "/" + p.name, bytes: p.bytes });
        }

        log("launch: " + (argv.join(" ") || "(no arguments)"));
        log("  iwad " + state.iwad.name + " sha256=" + state.iwad.hash);
        canonicalOrder(state.pwads).forEach((p, i) => {
          log("  " + (i + 1) + ". " + p.load + " " + p.name +
              " sha256=" + p.hash +
              " dehacked=" + (p.deh ? "on" : "off"));
        });
        log("  fingerprint " + (state.pwads.length ? fingerprint(state.pwads) : "(none)"));

        frame = document.createElement("iframe");
        frame.src = "doom-frame.html";
        el("stage").insertBefore(frame, el("log"));
        refresh();

        window.addEventListener("message", (e) => {
          const msg = e.data;
          if (!msg) return;
          if (msg.type === "doom-frame-ready" && frame &&
              e.source === frame.contentWindow) {
            frame.contentWindow.postMessage({ type: "doom-launch", argv, files }, "*");
          } else if (msg.type === "doom-log") {
            log(msg.text, msg.stream === "err" ? "warn" : null);
          }
        });
      }

      for (const id of ["room", "nodes", "deathmatch"]) {
        el(id).addEventListener("input", refresh);
        el(id).addEventListener("change", refresh);
      }
      for (const radio of document.querySelectorAll("input[name=mode]")) {
        radio.addEventListener("change", refresh);
      }
      el("launch").addEventListener("click", launch);
      refresh();
    </script>
  </body>
</html>
