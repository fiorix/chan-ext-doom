<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <base href="./">
    <title>Doom engine</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      body { display: grid; place-items: center; }
      canvas { width: 100%; height: 100%; border: 0; outline: 0; object-fit: contain; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <script src="doom.js"></script>
    <script>
      const nonce = window.name;
      window.name = "";
      const canvas = document.getElementById("canvas");
      let started = false;
      let engine = null;

      function report(type, detail = {}) {
        parent.postMessage({ type, nonce, ...detail }, "*");
      }

      // Chan's keyboard relay. Chan advertises the shell chords it claims as
      // key tokens under its layout-aware contract: the letter or punctuation
      // symbol the layout types, the top-row digit by position, or a named
      // key, each with exact modifiers. A keydown that resolves to one is
      // relayed through the outer page with its raw fields, and Chan resolves
      // and checks it again before acting on it. Everything else is game input.
      const HOST_KEYMAP = "chan:extension-host-keymap:v2";
      const HOST_KEYDOWN = "chan:extension-keydown:v2";
      const PUNCTUATION_KEYS = new Set(["`", "[", "]", ",", "=", "-", ".", ";", "/"]);
      const SHIFTED_KEYS = new Map([
        ["~", "`"], ["{", "["], ["}", "]"], ["<", ","], ["+", "="],
        ["_", "-"], [">", "."], [":", ";"], ["?", "/"],
      ]);
      const PUNCTUATION_CODES = new Map([
        ["Backquote", "`"], ["BracketLeft", "["], ["BracketRight", "]"],
        ["Comma", ","], ["Equal", "="], ["Minus", "-"], ["Period", "."],
        ["Semicolon", ";"], ["Slash", "/"],
      ]);
      const MODIFIER_KEYS = new Set(["Shift", "Alt", "Control", "Meta", "AltGraph", "Unidentified"]);
      const MAC = /Mac OS X|Macintosh/.test(navigator.userAgent);
      let hostKeys = [];

      // A keydown that enters text (an IME composition, a dead key, AltGr off
      // macOS) names no chord. Option on macOS replaces the key with a glyph,
      // so only then does the physical position decide.
      function shortcutKey(event) {
        const key = event.key;
        if (!key || MODIFIER_KEYS.has(key) || event.isComposing || key === "Process") return null;
        if (!MAC && event.getModifierState("AltGraph")) return null;
        const token = (name, shifted = false, consumable = false) => ({ key: name, shifted, consumable });
        const digit = /^Digit([0-9])$/.exec(event.code);
        if (digit) return token(digit[1]);
        if (/^[a-z]$/i.test(key)) return token(key.toUpperCase());
        if (PUNCTUATION_KEYS.has(key)) return token(key, false, true);
        if (SHIFTED_KEYS.has(key)) return token(SHIFTED_KEYS.get(key), true);
        if (event.altKey) {
          const letter = /^Key([A-Z])$/.exec(event.code);
          const position = letter ? letter[1] : PUNCTUATION_CODES.get(event.code);
          if (position) return token(position);
        }
        if (key === "Dead") return null;
        return token(key.length === 1 ? key.toUpperCase() : key);
      }

      // The exact chord, or the same chord without a Shift that only typed a
      // punctuation symbol.
      function claimedByHost(event) {
        const resolved = shortcutKey(event);
        if (!resolved) return false;
        const matches = (key, shiftKey) =>
          key?.key === resolved.key && key.ctrlKey === event.ctrlKey &&
          key.altKey === event.altKey && key.metaKey === event.metaKey &&
          key.shiftKey === shiftKey;
        return hostKeys.some((key) =>
          matches(key, event.shiftKey || resolved.shifted) ||
          (event.shiftKey && resolved.consumable && matches(key, false)));
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.nonce !== nonce || message.type !== HOST_KEYMAP) return;
        hostKeys = Array.isArray(message.keys) ? message.keys : [];
      });

      window.addEventListener("keydown", (event) => {
        if (claimedByHost(event)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          report(HOST_KEYDOWN, {
            key: event.key,
            code: event.code,
            ctrlKey: event.ctrlKey,
            altKey: event.altKey,
            metaKey: event.metaKey,
            shiftKey: event.shiftKey,
            repeat: event.repeat,
            isComposing: event.isComposing,
            altGraph: event.getModifierState("AltGraph"),
          });
          return;
        }
        if (event.key === " " || event.key.startsWith("Arrow")) event.preventDefault();
      }, true);
      // End of Chan's keyboard relay.

      function setAudioActive(active) {
        const context = engine?.SDL2?.audioContext || globalThis.SDL2?.audioContext;
        if (!context) return;
        if (active && context.state === "suspended") void context.resume();
        if (!active && context.state === "running") void context.suspend();
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.nonce !== nonce) return;
        if (message.type === "chan:extension-view-state:v1") {
          setAudioActive(message.active === true);
          return;
        }
        if (message.type !== "doom-launch" || started) return;
        started = true;
        Module({
          canvas,
          arguments: message.argv,
          print: (text) => report("doom-log", { stream: "out", text }),
          printErr: (text) => report("doom-log", { stream: "err", text }),
          preRun: [(runtime) => {
            for (const file of message.files) {
              runtime.FS.writeFile(file.path, new Uint8Array(file.bytes));
            }
          }],
          onRuntimeInitialized: () => {
            canvas.focus();
            report("doom-started");
          },
        }).then((runtime) => { engine = runtime; }).catch((error) => {
          report("doom-log", { stream: "err", text: `engine failed: ${error}` });
        });
      });

      report("doom-frame-ready");
    </script>
  </body>
</html>
